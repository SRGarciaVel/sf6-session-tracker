# Local PostgreSQL for development. The web app and worker run on the host (pnpm dev).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sf6
      POSTGRES_PASSWORD: sf6
      POSTGRES_DB: sf6_tracker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sf6 -d sf6_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
