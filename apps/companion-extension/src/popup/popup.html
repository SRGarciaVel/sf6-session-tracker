<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SST Companion for Street Fighter 6</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="hdr">
      <img class="hdr-mark" src="brand/sst-monogram.svg" alt="" width="60" height="17" />
      <div class="hdr-name">
        <p class="hdr-product">SST COMPANION</p>
        <p class="hdr-game">STREET FIGHTER 6</p>
      </div>
      <span id="version" class="hdr-version"></span>
    </header>

    <main>
      <section id="status" class="panel status" aria-labelledby="title">
        <p id="eyebrow" class="eyebrow" hidden></p>
        <h1 class="status-title">
          <span class="status-icon" aria-hidden="true"></span><span id="title"></span>
        </h1>
        <div id="body" class="status-body"></div>
        <ol id="steps" class="steps" hidden></ol>
        <p id="lastSyncRow" class="meta" hidden>
          <span class="meta-label" data-i18n="lastSync"></span>
          <span id="lastSync" class="meta-value"></span>
        </p>

        <form id="pairForm" class="form" hidden>
          <label id="trackerField" class="field" hidden>
            <span class="field-label" data-i18n="trackerUrl"></span>
            <select id="trackerUrl"></select>
          </label>
          <label class="field">
            <span class="field-label" data-i18n="pairingCode"></span>
            <input
              id="code"
              class="code"
              autocomplete="off"
              spellcheck="false"
              placeholder="XXXX-XXXX"
              required
            />
          </label>
          <label class="field">
            <span class="field-label" data-i18n="deviceName"></span>
            <input id="deviceName" maxlength="60" />
          </label>
          <button id="pair" type="submit" class="btn btn-primary"></button>
          <p class="help">
            <span class="help-q" data-i18n="pairHelpQuestion"></span>
            <span data-i18n="pairHelpAnswer"></span>
          </p>
        </form>

        <form id="cfnForm" class="form" hidden>
          <label class="field">
            <span class="field-label">CFN ID</span>
            <input id="cfnInput" inputmode="numeric" autocomplete="off" required />
          </label>
          <button id="saveCfn" type="submit" class="btn btn-primary"></button>
        </form>

        <div class="actions">
          <button id="primary" type="button" class="btn btn-primary" hidden></button>
          <button id="secondary" type="button" class="btn btn-secondary" hidden></button>
        </div>
      </section>

      <section id="session" class="panel session" aria-labelledby="sessionHeading" hidden>
        <h2 id="sessionHeading" class="label" data-i18n="sessionTitle"></h2>
        <p class="session-state">
          <span class="pip" aria-hidden="true"></span><span id="sessionState"></span>
        </p>
        <p id="sessionGuidance" class="session-guidance"></p>
        <p class="meta">
          <span class="meta-label" data-i18n="lastMatch"></span>
          <span id="lastMatch" class="meta-value"></span>
        </p>
      </section>

      <p id="closing" class="closing" hidden></p>
      <button id="sync" type="button" class="btn btn-secondary" hidden></button>
      <p id="message" class="message" role="status" aria-live="polite"></p>

      <details id="diagnostics" class="diagnostics" hidden>
        <summary data-i18n="diagnostics"></summary>
        <div id="diagGroups"></div>
        <pre id="debugTest" class="debug" hidden></pre>
        <div class="diag-actions">
          <button id="test" type="button" class="btn btn-secondary btn-small"></button>
          <button id="copy" type="button" class="btn btn-secondary btn-small"></button>
        </div>
        <button id="disconnect" type="button" class="btn-danger"></button>
      </details>
    </main>

    <footer class="privacy">
      <p class="privacy-title" data-i18n="privacyTitle"></p>
      <p data-i18n="privacyBody"></p>
    </footer>
    <script src="popup.js" type="module"></script>
  </body>
</html>
